[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprtheme"
version = "1.0.0"
description = "HyprTheme — Hyprland Theme Control Center"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "HyprTheme contributors" }]
keywords = ["hyprland", "wayland", "theme", "waybar", "kitty", "rofi", "gtk4", "libadwaita"]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
dependencies = []

[project.optional-dependencies]
gui = ["PyGObject>=3.46"]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
hyprtheme = "hyprtheme.cli:main"
hyprtheme-gui = "hyprtheme.app.main:run"

[tool.setuptools.packages.find]
include = ["hyprtheme*"]

[tool.setuptools.package-data]
"hyprtheme.app" = ["*.css"]

[tool.ruff]
line-length = 140
target-version = "py311"
exclude = ["config", "Background", "Screenshots"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"hyprtheme/app/*" = ["N802", "N803"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
packages = ["hyprtheme.core", "hyprtheme.cli"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gui: needs GTK4 + libadwaita + a display (xvfb-run)"]
